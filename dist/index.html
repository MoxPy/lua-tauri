<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Tauri Lua Test Suite</title>
  <style>
    html, body, div, h2, h3, pre, button {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 24px;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .panel {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #1e293b;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    button {
      padding: 8px 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    button:disabled { background: #334155; cursor: not-allowed; }
    pre {
      background: #030712;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 6px;
      color: #38bdf8;
      font-size: 11px;
      margin: 0;
      min-height: 90px;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .fps {
      font-size: 20px;
      font-weight: 700;
      color: #22c55e;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h2 style="margin:0;">Test Suite: Tauri-Lua</h2>
      <small id="origin-indicator" style="color:#94a3b8">Origin: rilevamento...</small>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="spinner"></div>
      <div class="fps" id="fps">-- FPS</div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h3>1. Concorrenza Isolates (4 Task)</h3>
      <button id="btn-isolates">Lancia Task Paralleli</button>
      <pre id="log-isolates">In attesa...</pre>
    </div>

    <div class="panel">
      <h3>2. Shared State Store</h3>
      <button id="btn-state-read">Leggi Stato</button>
      <button id="btn-state-burst">Burst 10 Scritture Atomiche</button>
      <pre id="log-state">In attesa...</pre>
    </div>

    <div class="panel">
      <h3>3. Finestre & Sicurezza Origin</h3>
      <button id="btn-open-settings">Apri Nuova Finestra</button>
      <button id="btn-sec-tamper">Test Manomissione Token</button>
      <pre id="log-sec">In attesa...</pre>
    </div>

    <div class="panel">
      <h3>4. Canali in Streaming</h3>
      <button id="btn-stream">Avvia Stream Countdown</button>
      <pre id="log-stream">In attesa dello stream...</pre>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
