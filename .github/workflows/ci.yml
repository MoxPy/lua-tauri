name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install luajit

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libluajit-5.1-dev luajit \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y luajit --no-progress
          $wv2Dir = "$env:GITHUB_WORKSPACE\deps\webview2"
          New-Item -ItemType Directory -Force -Path $wv2Dir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40" -OutFile "$wv2Dir\webview2.zip"
          Expand-Archive -Path "$wv2Dir\webview2.zip" -DestinationPath "$wv2Dir\pkg" -Force
          New-Item -ItemType Directory -Force -Path "$wv2Dir\include","$wv2Dir\lib\x64" | Out-Null
          Copy-Item "$wv2Dir\pkg\build\native\include\*" "$wv2Dir\include\" -Force
          Copy-Item "$wv2Dir\pkg\build\native\x64\WebView2LoaderStatic.lib" "$wv2Dir\lib\x64\" -Force

      - name: Configure & Build (Standard Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTAURILUA_RELEASE_FUSE=OFF
          cmake --build build --config Release

      - name: Run CTest Suite (Standard Release)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Configure & Build (Fused Release)
        run: |
          cmake -B build-fused -DCMAKE_BUILD_TYPE=Release -DTAURILUA_RELEASE_FUSE=ON
          cmake --build build-fused --config Release

      - name: Run CTest Suite (Fused Release)
        run: |
          ctest --test-dir build-fused -C Release --output-on-failure

      - name: Verify CLI Symlink Launcher & Frozen Lockfile (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./lua-tauri
          ln -sf "$(pwd)/lua-tauri" /tmp/lua-tauri-ci-link
          /tmp/lua-tauri-ci-link help > /dev/null
          rm -f /tmp/lua-tauri-ci-link

  sanitizers:
    name: ASan + UBSan (Native Security Suite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libluajit-5.1-dev luajit \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure & Build with ASan + UBSan
        run: |
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DTAURILUA_SANITIZERS=ON
          cmake --build build-san --target test_native_security test_origin_validator test_token_standalone

      - name: Run Sanitized C++ Security Tests
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          ctest --test-dir build-san --output-on-failure -R "test_native_security|test_origin_validator|test_token_standalone"
